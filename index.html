<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Анна Белихова — коммуникационный дизайнер</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#f4f4f2;color:#111;font-family:Arial,Helvetica,sans-serif}
    body.modal-open{overflow:hidden}
    .page{width:min(1440px,100%);margin:0 auto;position:relative;line-height:0;background:#fff}
    .resume{display:block;width:100%;height:auto}
    .hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;border-radius:999px;padding:0;z-index:2}
    .hotspot:focus-visible{outline:3px solid #111;outline-offset:2px}
    .h1{left:9.9653%;top:57.0166%;width:12.2917%;height:.9313%}
    .h2{left:24.3403%;top:57.0166%;width:37.2917%;height:.9313%}
    .h3{left:63.7153%;top:57.0166%;width:26.3889%;height:.9313%}
    .h4{left:11.9792%;top:58.3610%;width:35.6250%;height:.8485%}
    .h5{left:49.6875%;top:58.3610%;width:18.5417%;height:.8485%}
    .h6{left:70.3125%;top:58.3610%;width:17.7778%;height:.8485%}

    .backdrop{position:fixed;inset:0;background:rgba(15,15,15,.58);display:none;align-items:center;justify-content:center;padding:28px;z-index:50}
    .backdrop.is-open{display:flex}
    .modal{position:relative;width:min(900px,calc(100vw - 56px));max-height:82vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 28px 90px rgba(0,0,0,.3);overscroll-behavior:contain}
    .modal img{display:block;width:100%;height:auto}
    .close{position:sticky;top:16px;float:right;margin:16px 16px -60px 0;width:44px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 3px 16px rgba(0,0,0,.18);cursor:pointer;z-index:4;font-size:28px;line-height:42px;font-weight:300}
    .close:hover{transform:scale(1.03)}
    .loading{min-height:260px;display:grid;place-items:center;font-size:14px;line-height:1.4;color:#666}
    @media(max-width:700px){
      .backdrop{padding:10px}
      .modal{width:calc(100vw - 20px);max-height:90vh;border-radius:14px}
      .close{top:10px;margin:10px 10px -54px 0;width:42px;height:42px}
      .hotspot{min-height:30px}
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="resume" src="assets/resume.png" alt="Резюме Анны Белиховой" />
    <button class="hotspot h1" data-project="mailings" aria-label="Открыть: рассылки"></button>
    <button class="hotspot h2" data-project="navigation" aria-label="Открыть: навигация в ТЦ и наружная реклама"></button>
    <button class="hotspot h3" data-project="generation" aria-label="Открыть: генерация изображений"></button>
    <button class="hotspot h4" data-project="print" aria-label="Открыть: печатные макеты и их реализация"></button>
    <button class="hotspot h5" data-project="website" aria-label="Открыть: работа с сайтом"></button>
    <button class="hotspot h6" data-project="bonus" aria-label="Открыть: бонус макеты"></button>
  </main>

  <div class="backdrop" id="backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Просмотр работ">
      <button class="close" id="close" aria-label="Закрыть">×</button>
      <div class="loading" id="loading">Загрузка…</div>
      <img id="projectImage" alt="" hidden />
    </section>
  </div>

  <script>
    const projects = {
      mailings: ["assets/mailings.png","Рассылки"],
      navigation: ["assets/navigation.png","Навигация в ТЦ и наружная реклама"],
      generation: ["assets/generation.png","Генерация изображений"],
      print: ["assets/print.png","Печатные макеты и их реализация"],
      website: ["assets/website.png","Работа с сайтом"],
      bonus: ["assets/bonus.png","Бонус макеты"]
    };
    const backdrop=document.getElementById("backdrop");
    const modal=backdrop.querySelector(".modal");
    const close=document.getElementById("close");
    const img=document.getElementById("projectImage");
    const loading=document.getElementById("loading");

    function openProject(key){
      const item=projects[key]; if(!item) return;
      loading.hidden=false; img.hidden=true; img.alt=item[1]; img.src=item[0];
      backdrop.classList.add("is-open"); backdrop.setAttribute("aria-hidden","false");
      document.body.classList.add("modal-open");
      modal.scrollTop=0; close.focus();
    }
    function closeModal(){
      backdrop.classList.remove("is-open"); backdrop.setAttribute("aria-hidden","true");
      document.body.classList.remove("modal-open"); img.removeAttribute("src");
    }
    img.addEventListener("load",()=>{loading.hidden=true;img.hidden=false});
    document.querySelectorAll("[data-project]").forEach(b=>b.addEventListener("click",()=>openProject(b.dataset.project)));
    close.addEventListener("click",closeModal);
    backdrop.addEventListener("click",e=>{if(e.target===backdrop) closeModal()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&backdrop.classList.contains("is-open")) closeModal()});
  </script>
</body>
</html>
