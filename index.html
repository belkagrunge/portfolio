<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Анна Белихова — портфолио</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#151515;overflow-x:hidden}html,body{margin:0;width:100%;min-height:100%;background:#151515;color:#111;font-family:Arial,Helvetica,sans-serif;overscroll-behavior-y:none;overflow-x:hidden}
body.modal-open{overflow:hidden}
.page{width:100%;max-width:1100px;margin:0 auto;position:relative;line-height:0;background:#151515;overflow:hidden}
.page::after{content:"";position:absolute;top:0;right:-1px;width:2px;height:100%;background:#151515;pointer-events:none;z-index:1}
.resume{display:block;width:100%;max-width:none;height:auto}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:999px;padding:0;z-index:2}
.hotspot:focus-visible{outline:3px solid #111;outline-offset:2px}
.h1{left:9.97%;top:75.35%;width:12.29%;height:.94%}
.h2{left:24.34%;top:75.35%;width:37.29%;height:.94%}
.h3{left:63.72%;top:75.35%;width:26.39%;height:.94%}
.h4{left:11.98%;top:76.70%;width:35.63%;height:.86%}
.h5{left:49.69%;top:76.70%;width:18.54%;height:.86%}
.h6{left:70.31%;top:76.70%;width:17.78%;height:.86%}
.contact-link{position:absolute;display:block;z-index:3;background:transparent}
.telegram-link{left:51.11%;top:57.97%;width:26.86%;height:1.06%}
.behance-link{left:4.0972%;top:80.8568%;width:35.1389%;height:.8899%}
.instagram-link{left:51.11%;top:60.60%;width:26.39%;height:.44%}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.60);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.backdrop.is-open{display:flex}
.modal{position:relative;width:min(760px,calc(100vw - 40px));max-height:78vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 28px 90px rgba(0,0,0,.3);overscroll-behavior:contain}
.modal-inner{min-height:520px;padding:84px 50px 60px;line-height:1.35}
.modal-title{font-size:32px;line-height:1.08;margin:0 0 18px}
.modal-note{font-size:16px;line-height:1.5;color:#666;margin:0;max-width:520px}
.close{position:sticky;top:14px;float:right;margin:14px 14px -58px 0;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.98);box-shadow:0 3px 18px rgba(0,0,0,.18);cursor:pointer;z-index:3;font-size:28px;line-height:40px;font-weight:300}
@media(max-width:700px){
  .backdrop{padding:8px}
  .modal{width:calc(100vw - 16px);max-height:90vh;border-radius:14px}
  .modal-inner{min-height:65vh;padding:72px 24px 40px}
  .modal-title{font-size:26px}
  .close{top:10px;margin:10px 10px -54px 0}
}
</style>
</head>
<body>
<main class="page">
  <img class="resume" src="assets/resume.png" alt="Резюме Анны Белиховой">
  <button class="hotspot h1" data-project="Рассылки" aria-label="Рассылки"></button>
  <button class="hotspot h2" data-project="Навигация в ТЦ и наружная реклама" aria-label="Навигация в ТЦ и наружная реклама"></button>
  <button class="hotspot h3" data-project="Генерация изображений" aria-label="Генерация изображений"></button>
  <button class="hotspot h4" data-project="Печатные макеты и их реализация" aria-label="Печатные макеты и их реализация"></button>
  <button class="hotspot h5" data-project="Работа с сайтом" aria-label="Работа с сайтом"></button>
  <button class="hotspot h6" data-project="Бонус макеты" aria-label="Бонус макеты"></button>
  <a class="contact-link telegram-link" href="https://t.me/belkagrunge" target="_blank" rel="noopener noreferrer" aria-label="Telegram"></a>
  <a class="contact-link behance-link" href="https://www.behance.net/belkagrunge" target="_blank" rel="noopener noreferrer" aria-label="Behance"></a>
  <a class="contact-link instagram-link" href="https://instagram.com/belkagrunge" target="_blank" rel="noopener noreferrer" aria-label="Instagram"></a>
</main>
<div class="backdrop" id="backdrop" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="Закрыть">×</button>
    <div class="modal-inner">
      <h1 class="modal-title" id="modalTitle"></h1>
      <p class="modal-note">Здесь будет макет раздела из Figma. Сейчас это первый веб-прототип, чтобы проверить размер окна, скролл и закрытие. Следующим шагом подставим сами работы без изменения твоего дизайна.</p>
    </div>
  </section>
</div>
<script>
const backdrop=document.getElementById('backdrop');
const closeBtn=document.getElementById('close');
const title=document.getElementById('modalTitle');
function openModal(name){
  title.textContent=name;
  if(typeof stopSmoothScroll === 'function') stopSmoothScroll();
  backdrop.classList.add('is-open');
  backdrop.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
  closeBtn.focus();
}
function closeModal(){
  backdrop.classList.remove('is-open');
  backdrop.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
  requestAnimationFrame(()=>{
    if(typeof syncSmoothScroll === 'function') syncSmoothScroll();
  });
}
document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.project)));
closeBtn.addEventListener('click',closeModal);
backdrop.addEventListener('click',e=>{if(e.target===backdrop) closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal()});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = window.matchMedia('(pointer: coarse)').matches;
if(!reduceMotion && !isTouch){
  let current = window.scrollY;
  let target = window.scrollY;
  let raf = null;

  window.stopSmoothScroll = function(){
    if(raf){
      cancelAnimationFrame(raf);
      raf = null;
    }
    current = window.scrollY;
    target = window.scrollY;
  };

  window.syncSmoothScroll = function(){
    current = window.scrollY;
    target = window.scrollY;
  };

  const maxScroll = () => Math.max(0, document.documentElement.scrollHeight - window.innerHeight);

  function tick(){
    current += (target - current) * 0.115;
    if(Math.abs(target - current) < 0.35){
      current = target;
      window.scrollTo(0, current);
      raf = null;
      return;
    }
    window.scrollTo(0, current);
    raf = requestAnimationFrame(tick);
  }

  window.addEventListener('wheel', e => {
    if(document.body.classList.contains('modal-open')) return;
    if(e.ctrlKey) return;
    e.preventDefault();
    current = window.scrollY;
    target = Math.min(maxScroll(), Math.max(0, target + e.deltaY * 0.99));
    if(!raf) raf = requestAnimationFrame(tick);
  }, {passive:false});

  window.addEventListener('scroll', () => {
    if(!raf){
      current = window.scrollY;
      target = window.scrollY;
    }
  }, {passive:true});
}
</script>
</body>
</html>
